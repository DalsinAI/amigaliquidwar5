<?xml version="1.0" encoding="UTF-8"?>
<!-- Liquid War 5 GlowIcon art: a blue and a red liquid army meeting in a
     maze, each flowing to its cursor. The AmiCradle Team's own drawing;
     GPL-2 or later, like the game. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e4"/>
      <stop offset="1" stop-color="#c9c0a8"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#9ad0ff"/>
      <stop offset="0.5" stop-color="#2f7fe0"/>
      <stop offset="1" stop-color="#123a8a"/>
    </radialGradient>
    <radialGradient id="red" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffb0a0"/>
      <stop offset="0.5" stop-color="#e03a2a"/>
      <stop offset="1" stop-color="#7a120c"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#floor)" stroke="#2a2a33" stroke-width="3"/>
  <!-- maze walls -->
  <g fill="#3c3a44">
    <rect x="30" y="18" width="10" height="40" rx="2"/>
    <rect x="88" y="70" width="10" height="40" rx="2"/>
    <rect x="52" y="56" width="24" height="10" rx="2"/>
  </g>
  <!-- the blue army -->
  <path d="M10 70 Q12 50 24 62 Q34 70 44 66 Q58 62 56 76 Q54 88 66 90 Q76 92 70 104
           Q62 118 40 116 Q14 116 10 100 Z" fill="url(#blue)" stroke="#0c2458" stroke-width="2"/>
  <!-- the red army -->
  <path d="M118 12 Q120 40 106 46 Q96 50 98 58 Q100 66 86 66 Q72 66 76 50
           Q80 38 66 34 Q52 30 58 18 Q62 10 80 10 Z" fill="url(#red)" stroke="#560c08" stroke-width="2"/>
  <!-- where they meet -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="64" cy="80" r="2.5"/>
    <circle cx="78" cy="68" r="2"/>
    <circle cx="70" cy="74" r="1.5"/>
  </g>
  <!-- the two cursors -->
  <g stroke="#ffffff" stroke-width="3" fill="none">
    <path d="M34 92 l8 0 m-4 -4 l0 8"/>
    <path d="M94 26 l8 0 m-4 -4 l0 8"/>
  </g>
</svg>
